bio: |
  I'm a linguist interested in language change and comparison, language documentation and description, and the interplay of language and culture and history.
  My current work has a particular focus on Mixtecan languages and the diachrony of tone.
  I combine methods and approaches from historical linguistics, typology, and language documentation. I develop workflows, databases, and analyses that are re-usable and reproducible for researchers and can be made useful to the communities that share their data.

  I'm currently a post-doctoral researcher in the Department of Linguistics at the University of Bern. I have a PhD in Linguistics from the University of California, Santa Barbara (USA) and the Department of Linguistic and Cultural Evolution at the Max Planck Institute for Evolutionary Anthropology in Leipzig (Germany).
  My [dissertation](/resources/thesis-project) is a collection of three articles on Mixtec(an) language history using qualitative and quantitative methods.

